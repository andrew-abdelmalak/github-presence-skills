schema_version: "1.1"
name: hardening-private-repo-limits
description: States plan limits for a private repository on GitHub Free instead of failing silently.
tags: [hardening, facts]
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    My repo dmitri-v/qrate is private and I'm on GitHub Free. I want rulesets, secret scanning,
    and Dependabot on it. What can I actually turn on?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-repo-hardening"'
  - name: plan-limits
    type: llm
    criteria: |
      PASS if the response says rulesets on a private repository need a paid plan (GitHub Pro,
      Team, or Enterprise Cloud), says secret scanning on a user-owned private repository is not
      available on GitHub Free without a paid security product, and says Dependabot alerts and
      updates are available and can be set up now.
      FAIL if it claims rulesets or secret scanning can be enabled on this private repository on
      GitHub Free.
