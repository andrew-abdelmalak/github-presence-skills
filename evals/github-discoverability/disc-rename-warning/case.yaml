schema_version: "1.1"
name: disc-rename-warning
description: Rename advice warns that action references are not redirected.
tags: [discoverability, facts]
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I want to rename my repo acme-labs/setup-tq-action to acme-labs/tinyqueue-action. Other repos
    use it in their workflows as `uses: acme-labs/setup-tq-action@v1`. Any problem with renaming?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-discoverability"'
  - name: warns-actions
    type: llm
    criteria: |
      PASS if the response warns that GitHub does not redirect action references after a rename,
      so workflows using `uses: acme-labs/setup-tq-action@v1` would fail; offers a mitigation (for
      example, keep the old repository, publish the action under the new name and migrate callers,
      or update every caller first); and treats any rename command as needing approval.
      FAIL if it says GitHub's redirects make the rename safe for those workflows.
