schema_version: "1.1"
name: audit-connector-fallback
description: Audit from GitHub connector results when gh is unavailable; settings the connector cannot see stay Unknown.
tags: [audit, data-tiers, connector]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Audit acme-labs/tinyqueue. gh isn't installed, but my GitHub connector returned this:
    - search_repositories (minimal_output false): description "Dependency-free job queue for Python scripts, backed by SQLite", topics [python, job-queue, sqlite, task-queue, background-jobs], license MIT, has_issues true, has_discussions false, has_wiki true, archived false, default_branch main.
    - get_file_contents "/": README.md, LICENSE, CONTRIBUTING.md, SECURITY.md, pyproject.toml, tinyqueue/, tests/, .github/
    - get_file_contents ".github": workflows/, ISSUE_TEMPLATE/, dependabot.yml
    - get_file_contents ".github/ISSUE_TEMPLATE": bug_report.yml, config.yml
    - list_releases: v0.3.0 and v0.2.0, both published, not drafts.
    - README.md has install (pip install tinyqueue) and a usage example; the wiki has no pages.
    It's a library for other developers. Tell me what to fix.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-repo-audit"'
  - name: unseen-checks-not-fixes
    type: llm
    criteria: |
      Look only at three checks the connector data cannot show: branch protection or rulesets,
      security features (secret scanning, Dependabot alerts), and the social preview image.
      PASS if none of the three is given a Fix or failure verdict and none appears in the ranked
      list of fixes. Marking them Unknown, or saying they could not be checked, passes.
      FAIL if any of the three is reported as missing or as needing a fix.
  - name: issue-forms-recognized
    type: llm
    criteria: |
      PASS if the response treats the repository as having issue forms or templates
      (bug_report.yml and config.yml were listed). FAIL if it says the repository has no issue
      templates or forms.
  - name: how-to-check-list
    type: regex
    pattern: '[Hh]ow to check'
  - name: unknowns-actionable
    type: llm
    criteria: |
      PASS if the response gives a concrete way to check each of these three: branch protection or
      rulesets, security features (secret scanning or Dependabot alerts), and the social preview.
      A concrete way is an exact gh command or API call, or a GitHub settings path such as
      "Settings → General → Social preview". FAIL if any of the three has no command or path,
      or if the response only says that they need gh or the GitHub UI.
