schema_version: "1.1"
name: audit-go-public-trigger
description: Natural phrasing about going public should trigger the audit; tracks the trigger rate.
tags: [audit, pre-public, trigger]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I'm about to flip acme-labs/billing-sync from private to public next week. Before I do,
    what should I check? The repo has a README, a few config files, and about two years of history.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-repo-audit"'
  - name: covers-history
    type: llm
    criteria: |
      PASS if the response says secrets must be checked in the full git history, not only the
      current files, says any leaked secret must be rotated (deleting it is not enough), and
      mentions reviewing commit author emails and adding a license before going public.
      FAIL if it only checks the current files, or omits rotation.
