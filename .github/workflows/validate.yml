name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python tools
        # skills-ref is installed from its official source at a pinned commit: the PyPI
        # release (0.1.1) does not install the `skills-ref` command.
        run: |
          python -m pip install --quiet "pyyaml==6.0.3" "reuse==6.2.0" \
            "skills-ref @ git+https://github.com/agentskills/agentskills@f130f348f502d9804278a617f86929846896d2e9#subdirectory=skills-ref"

      - name: Self-test the checker
        run: python scripts/check_skills.py --self-test

      - name: Check skills, links, symlinks, README, manifests, and eval coverage
        run: python scripts/check_skills.py

      - name: Validate each skill against the Agent Skills spec
        run: for d in skills/*/; do skills-ref validate "$d"; done

      - name: Lint the README with the package's own linter
        run: |
          python skills/github-readme-writer/scripts/lint_readme.py --self-test
          python skills/github-readme-writer/scripts/lint_readme.py README.md

      - name: Check licensing (REUSE)
        run: reuse lint

      - name: Check shell script syntax
        run: for f in skills/*/scripts/*.sh; do bash -n "$f"; done

      - name: Validate plugin and marketplace manifests
        run: |
          npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@2.1.296"
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
