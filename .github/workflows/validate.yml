name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python tools
        # Every package, including skills-ref from its official source at a pinned commit,
        # is locked by hash. skills-ref and reuse build from source on Python 3.13, so their build backends are installed
        # first from their own lock, and the builds run without an isolated (unpinned) environment.
        run: |
          python -m pip install --quiet --require-hashes -r ci/build-requirements.txt
          python -m pip install --quiet --require-hashes --no-build-isolation -r ci/requirements.txt

      - name: Self-test the checker
        run: python scripts/check_skills.py --self-test

      - name: Check skills, links, symlinks, README, manifests, and eval coverage
        run: python scripts/check_skills.py

      - name: Validate each skill against the Agent Skills spec
        run: for d in skills/*/; do skills-ref validate "$d"; done

      - name: Lint the README with the package's own linter
        run: |
          python skills/github-readme-writer/scripts/lint_readme.py --self-test
          python skills/github-readme-writer/scripts/lint_readme.py README.md

      - name: Check licensing (REUSE)
        run: reuse lint

      - name: Check shell script syntax
        run: for f in skills/*/scripts/*.sh; do bash -n "$f"; done

      - name: Validate plugin and marketplace manifests
        run: |
          npm ci --prefix ci --no-fund --no-audit
          ci/node_modules/.bin/claude plugin validate .claude-plugin/plugin.json --strict
          ci/node_modules/.bin/claude plugin validate .claude-plugin/marketplace.json --strict
